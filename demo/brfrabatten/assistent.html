<!DOCTYPE html>
<!-- Site-local presentation of the existing rabatten assistant.
     Source: clientrelay/widget/iframe.html @ a8eba6849c14d61f74d6e9c00aa64f0a7f493def.
     Fixed client/production endpoint, language/title, branding and local privacy information.
     No backend configuration or other ClientRelay client is changed. -->
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Brf Rabatten · Simply BRF AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color: #007bc0;
      --color-light: #0a4b68;
      --on-color: #ffffff;
      --on-color-muted: rgba(255,255,255,0.85);
      --on-color-soft: rgba(255,255,255,0.6);
      --on-color-faint: rgba(255,255,255,0.5);
      --bg: #ffffff;
      --bg-msg: rgba(0, 0, 0, 0.04);
      --text: #080808;
      --text-muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
      --radius: 16px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout ── */
    .chat-wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100%;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .chat-wrap.ready { opacity: 1; }

    /* ── Header ── */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--color), var(--color-light));
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
      color: var(--on-color);
    }
    .chat-avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name  { font-weight: 700; font-size: 14px; color: var(--on-color); }
    .chat-header-status {
      font-size: 11px;
      color: var(--on-color-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chat-header-status::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }
    .chat-new-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: var(--on-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: auto;
      transition: background 0.2s;
      padding: 0;
    }
    .chat-new-btn:hover { background: rgba(255,255,255,0.25); }

    /* ── Human Assist Header Button ── */
    .chat-human-btn {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.18);
      color: var(--on-color);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      animation: human-glow 2s ease-in-out infinite;
    }
    .chat-human-btn.visible { display: flex; }
    .chat-human-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }
    .chat-human-btn:active { transform: scale(0.95); }
    .chat-human-btn .human-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      animation: human-blink 2s ease-in-out infinite;
    }
    @keyframes human-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
      50% { box-shadow: 0 0 0 5px rgba(74, 222, 128, 0); }
    }
    @keyframes human-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Messages ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .ps-msg { display: flex; align-items: flex-end; gap: 8px; animation: fadeUp .2s ease; }
    .ps-msg.user  { flex-direction: row-reverse; }
    .ps-msg.bot   { flex-direction: row; }
    .ps-msg.system { justify-content: center; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ps-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 12px;
      line-height: 1.55;
      word-break: break-word;
    }
    .user .ps-bubble {
      background: linear-gradient(135deg, var(--color), var(--color-light));
      color: var(--on-color);
      border-bottom-right-radius: 4px;
    }
    .bot .ps-bubble {
      background: var(--bg-msg);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bot .ps-bubble a {
      color: #2563eb;
      text-decoration: underline;
    }
    .chat-privacy-note {
      max-width: 82%;
      padding: 2px 8px;
      color: rgba(0,0,0,0.52);
      font-size: 10px;
      line-height: 1.4;
      text-align: center;
    }
    .chat-privacy-note a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ── Typing indicator ── */
    .ps-typing .ps-bubble {
      display: flex;
      gap: 5px;
      padding: 12px 16px;
      align-items: center;
    }
    .ps-typing .ps-bubble span:not(.ps-typing-label) {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
      display: inline-block;
    }
    .ps-typing .ps-bubble span:nth-child(2) { animation-delay: .2s; }
    .ps-typing .ps-bubble span:nth-child(3) { animation-delay: .4s; }
    .ps-typing .ps-typing-label { width: auto; height: auto; margin-left: 6px; background: transparent; animation: none; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-5px); }
    }

    /* ── Suggestions ── */
    .chat-suggestions {
      padding: 0 16px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ps-suggest-btn {
      background: transparent;
      border: 1px solid var(--color);
      color: var(--color);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .ps-suggest-btn:hover {
      background: var(--color);
      color: var(--on-color);
    }

    .chat-input-wrap {
      padding: 12px 16px 10px;
      border-top: 1px solid rgba(0,0,0,0.1);
      background: linear-gradient(135deg, var(--color-light), var(--color));
      flex-shrink: 0;
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 12px;
      padding: 8px 10px 8px 14px;
      transition: border-color .2s;
    }
    .chat-input-row:focus-within {
      border-color: rgba(255,255,255,0.8);
    }
    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #1e293b;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.5;
      max-height: 100px;
      overflow-y: auto;
    }
    .chat-input::placeholder { color: rgba(0,0,0,0.35); }
    .chat-send-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--color), var(--color-light));
      color: var(--on-color);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .15s, transform .1s;
    }
    .chat-send-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(1.05); }
    .chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-mic-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #475569;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s, transform .1s, box-shadow .15s;
    }
    .chat-mic-btn:hover { background: rgba(15,23,42,0.08); transform: scale(1.05); }
    .chat-mic-btn.listening {
      background: #b91c1c;
      color: #fff;
      box-shadow: 0 0 0 2px rgba(185,28,28,0.2);
    }
    /* Waiting for the privacy notice to be acknowledged: put the "press again"
       cue on the button itself, not only in the note below it. */
    .chat-mic-btn.awaiting-confirm {
      box-shadow: 0 0 0 3px rgba(0,0,0,0.12);
      animation: chat-mic-attention 1.3s ease-in-out infinite;
    }
    @keyframes chat-mic-attention {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.09); }
    }
    @media (prefers-reduced-motion: reduce) {
      .chat-mic-btn.awaiting-confirm { animation: none; }
    }
    .chat-mic-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* Both buttons below are revealed from the config response and ship
       hidden. The `hidden` attribute alone is not enough: the display rules
       above are author styles, and author styles beat the browser's own
       [hidden] rule, so an opted-out chatbot would still show the button. */
    .chat-mic-btn[hidden],
    .chat-lead-btn[hidden] { display: none; }

    /* Lead-capture shortcut. Same shape as the microphone so the input row
       stays one family; matches .ps-lead-shortcut in widget/chatbot.js. */
    .chat-lead-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #475569;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s, transform .1s;
    }
    .chat-lead-btn:hover { background: rgba(15,23,42,0.08); transform: scale(1.05); }
    .chat-lead-btn:active { transform: scale(0.95); }
    .chat-dictation-status {
      display: none;
      color: var(--on-color);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.4;
      padding: 6px 8px;
      margin-top: 4px;
      border-radius: 8px;
      background: rgba(0,0,0,0.06);
    }
    .chat-dictation-status.visible { display: block; }

    .chat-footer {
      text-align: center;
      padding: 6px 10px 8px;
      font-size: 10px;
      color: var(--on-color-soft);
      background: var(--color);
      border-top: 1px solid rgba(0,0,0,0.1);
    }
    .chat-footer a {
      color: var(--on-color-muted);
      text-decoration: none;
    }
    .chat-footer a:hover { color: var(--on-color); }

    /* ── Lead Form ── */
    .ps-lead-card {
      background: var(--color);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 14px;
      padding: 16px;
      margin: 4px 0;
      animation: fadeUp 0.3s ease;
      position: relative;
    }
    .ps-lead-card .ps-lead-dismiss {
      position: absolute; top: 8px; right: 10px;
      background: none; border: none; color: var(--on-color-soft);
      font-size: 18px; cursor: pointer; padding: 4px; line-height: 1;
    }
    .ps-lead-card .ps-lead-dismiss:hover { color: var(--on-color); }
    .ps-lead-card label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--on-color-muted); margin-bottom: 4px; margin-top: 10px;
    }
    .ps-lead-card label:first-of-type { margin-top: 0; }
    .ps-lead-card .ps-req { color: #fbbf24; }
    .ps-lead-card input, .ps-lead-card textarea {
      width: 100%; padding: 9px 12px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px; color: var(--on-color);
      font-size: 13px; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .ps-lead-card input:focus, .ps-lead-card textarea:focus { border-color: rgba(255,255,255,0.6); }
    .ps-lead-card input::placeholder, .ps-lead-card textarea::placeholder { color: var(--on-color-faint); }
    .ps-lead-card textarea {
      resize: vertical; min-height: 50px; max-height: 120px;
      line-height: 1.4;
    }
    .ps-lead-submit {
      width: 100%; margin-top: 14px; padding: 10px;
      border: none; border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: var(--on-color); font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: opacity 0.2s;
    }
    .ps-lead-submit:hover { opacity: 0.9; background: rgba(255,255,255,0.3); }
    .ps-lead-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="chat-wrap">
  <!-- Header -->
  <div class="chat-header" id="chatHeader">
    <div class="chat-avatar" id="chatAvatar">✦</div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="chatName">AI-assistent</div>
      <div class="chat-header-status">Online</div>
    </div>
    <button class="chat-human-btn" id="chatHumanBtn" aria-label="Talk to a human" title="Talk to a human"><span class="human-dot"></span><span>Talk to a human</span></button>
    <button class="chat-new-btn" id="chatNewBtn" aria-label="Ny samtale" title="Ny samtale"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- Suggestions -->
  <div class="chat-suggestions" id="chatSuggestions"></div>

  <!-- Input -->
  <div class="chat-input-wrap">
    <div class="chat-input-row">
      <textarea
        class="chat-input"
        id="chatInput"
        placeholder="Type a message..."
        rows="1"
        aria-label="Melding"
      ></textarea>
      <button class="chat-lead-btn" id="chatLead" type="button" aria-label="Contact form" title="Leave your contact info" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
      </button>
      <button class="chat-mic-btn" id="chatMic" type="button" aria-label="Start dictation" title="Start dictation" aria-pressed="false" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </button>
      <button class="chat-send-btn" id="chatSend" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="chat-dictation-status" id="chatDictationStatus" role="status" aria-live="polite"></div>
  </div>

  <!-- Footer -->
  <div class="chat-footer" id="chatFooter">
    <a href="https://www.simplybrf.se/" target="_blank" rel="noopener">Powered by Simply BRF AI</a> · <a href="integritet.html" target="_blank" rel="noopener">Integritet</a>
  </div>
</div>

<script>
  (function () {
    'use strict';

    const CHAT_API_URL = 'https://api.clientrelay.tech/functions/v1/chat';
    const _ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5d2NueWltbGhpd2JicXF6dm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NjIyOTYsImV4cCI6MjA4MTEzODI5Nn0.rVPlSGwbKz-HyODCz3f2tFW-9sm1X3zRVuWoDuwsM24';
    const MAX_PER_MIN = 6;

    // ── Read URL params ──────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const CLIENT_ID = 'rabatten';
    const API_URL = CHAT_API_URL;
    const paramColor = params.get('color'); // e.g. ?color=%23e87722
    const paramBrandTextColor = params.get('brandText');
    const paramHideBrand = params.get('nobrand'); // ?nobrand=1

    if (!CLIENT_ID) {
      document.getElementById('chatMessages').innerHTML =
        '<div style="padding:32px;text-align:center;color:#f87171">Mangler ?client= parameter i URL</div>';
      return;
    }

    function normalizeHexColor(raw) {
      const value = String(raw || '').trim();
      return /^#[0-9a-f]{6}$/i.test(value) ? value.toLowerCase() : '';
    }
    function relativeLuminance(hex) {
      const value = normalizeHexColor(hex) || '#000000';
      const channels = [1, 3, 5].map(offset => {
        const channel = parseInt(value.slice(offset, offset + 2), 16) / 255;
        return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
      });
      return (0.2126 * channels[0]) + (0.7152 * channels[1]) + (0.0722 * channels[2]);
    }
    function contrastTextColor(background) {
      const backgroundLuminance = relativeLuminance(background);
      const dark = '#111827';
      const darkLuminance = relativeLuminance(dark);
      const whiteContrast = 1.05 / (backgroundLuminance + 0.05);
      const darkContrast = (Math.max(backgroundLuminance, darkLuminance) + 0.05) / (Math.min(backgroundLuminance, darkLuminance) + 0.05);
      return darkContrast >= whiteContrast ? dark : '#ffffff';
    }
    function rgbaColor(hex, alpha) {
      const value = normalizeHexColor(hex) || '#ffffff';
      return `rgba(${parseInt(value.slice(1, 3), 16)},${parseInt(value.slice(3, 5), 16)},${parseInt(value.slice(5, 7), 16)},${alpha})`;
    }

    let currentBrandColor = '#007bc0';
    let brandTextOverride = '';
    function applyBrandTextVariables() {
      const foreground = brandTextOverride || contrastTextColor(currentBrandColor);
      document.documentElement.style.setProperty('--on-color', foreground);
      document.documentElement.style.setProperty('--on-color-muted', rgbaColor(foreground, 0.85));
      document.documentElement.style.setProperty('--on-color-soft', rgbaColor(foreground, 0.6));
      document.documentElement.style.setProperty('--on-color-faint', rgbaColor(foreground, 0.5));
    }
    function applyBrandColor(raw) {
      const value = normalizeHexColor(raw);
      if (!value) return;
      currentBrandColor = value;
      const num = parseInt(value.replace('#',''), 16);
      const r = Math.min(255, (num >> 16) + 30);
      const g = Math.min(255, ((num >> 8) & 0xff) + 30);
      const b = Math.min(255, (num & 0xff) + 30);
      const light = '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6,'0');
      document.documentElement.style.setProperty('--color', value);
      document.documentElement.style.setProperty('--color-light', light);
      applyBrandTextVariables();
    }
    function applyBrandTextColor(raw) {
      brandTextOverride = normalizeHexColor(raw);
      applyBrandTextVariables();
    }

    if (paramColor) applyBrandColor(paramColor);
    if (paramBrandTextColor !== null) applyBrandTextColor(paramBrandTextColor);
    else applyBrandTextVariables();
    // TEMPORARILY DISABLED: branding always visible for marketing.
    // FUTURE: Re-enable as superhub-controlled per-client toggle.
    // if (paramHideBrand === '1') {
    //   const footer = document.getElementById('chatFooter');
    //   if (footer) footer.style.display = 'none';
    // }

    // ── State ────────────────────────────────────────────────────
    let isTyping = false;
    let activeChatController = null;
    let activeChatGeneration = 0;
    let chatHistory = [];
    const timestamps = [];
    let leadConfig = null;
    let leadFormShown = false;
    let leadFormRenderCount = 0;
    let humanAvailable = false;
    let inHumanMode = false;
    let liveSessionId = null;
    let liveSessionToken = null;
    let humanPollInterval = null;
    let humanPollLastTime = null;
    const microphonePolicy = document.permissionsPolicy || document.featurePolicy;
    const microphoneAllowed = !microphonePolicy?.allowsFeature || microphonePolicy.allowsFeature('microphone');
    const SpeechRecognitionCtor = microphoneAllowed && (window.SpeechRecognition || window.webkitSpeechRecognition);
    let recognition = null;
    let isListening = false;
    let dictationBaseValue = '';
    let dictationFinalText = '';
    let dictationHadError = false;
    let dictationSilentEnd = false;
    let dictationStatusTimer = null;
    // Shown once per visitor, not once per page load. Previously the first mic
    // press of every visit only printed the notice and started nothing.
    const DICTATION_ACK_KEY = 'cr_dictation_disclosed';
    function readDictationAck() {
      try { return localStorage.getItem(DICTATION_ACK_KEY) === '1'; } catch { return false; }

    function persistDictationAck() {

  function widgetHistoryLanguageText() {
    return chatHistory
      .filter(item => item && item.role === 'user')
      .map(item => item.parts && item.parts[0] && item.parts[0].text || '')
      .join('\n');
  }

  function detectWidgetLanguage(primary, fallback) {
    const languages = Object.keys(WIDGET_LANGUAGE_MARKERS);
    const winnerOf = (text) => {
      const raw = String(text || '');
      const prose = raw.replace(/\(https?:\/\/[^)]+\)/g, ' ').toLowerCase();
      const tokens = prose.split(/[^\p{L}]+/u);
      const scores = languages.map(lang => {
        const markers = WIDGET_LANGUAGE_MARKERS[lang];
        let wordHits = 0;
        for (const token of tokens) if (markers.includes(token)) wordHits++;
        const letters = WIDGET_LANGUAGE_LETTERS[lang];
        const letterHits = letters ? (raw.match(letters) || []).length : 0;
        return { lang, wordHits, score: wordHits * 2 + letterHits };
      }).sort((a, b) => b.score - a.score);
      if (scores[0].wordHits === 0 || scores[0].score === scores[1].score) return null;
      return scores[0].lang;
    };
    return winnerOf(primary) || winnerOf(fallback);
  }

  function widgetMessage(kind, primaryText) {

    // the bot's own language, then the browser. Short shopping words like
    // "kaffekopper" carry no marker signal, and the status labels must not
    // flip to English while the bot itself is answering in Norwegian.
    const botLanguage = botLanguageCode();
    const browserLanguage = browserLanguageCode();
    const lang = detectWidgetLanguage(primaryText, widgetHistoryLanguageText())
      || (WIDGET_MESSAGES[kind][botLanguage] ? botLanguage : '')
      || (WIDGET_MESSAGES[kind][browserLanguage] ? browserLanguage : 'en');
    return WIDGET_MESSAGES[kind][lang] || WIDGET_MESSAGES[kind].en;
  }
    function dictationMessage(kind) {
      const browserLanguage = String(navigator.language || '').toLowerCase().split('-')[0];
      const localeLanguage = browserLanguage === 'no' ? 'nb' : browserLanguage;
      // What the visitor wrote, then the bot's own language, then the browser.
      // A Norwegian bot must not report errors in English just because the
      // visitor runs an English browser.
      const botLanguage = botLanguageCode();
      const lang = detectWidgetLanguage(inputEl.value, widgetHistoryLanguageText())
        || (WIDGET_MESSAGES[kind][botLanguage] ? botLanguage : '')
        || (WIDGET_MESSAGES[kind][localeLanguage] ? localeLanguage : 'en');
      return WIDGET_MESSAGES[kind][lang] || WIDGET_MESSAGES[kind].en;
    }

    function syncComposerState() {
      sendBtn.disabled = isTyping || isListening;
      inputEl.readOnly = isListening;
      micBtn.disabled = isTyping;
    }

    function showDictationStatus(message, timeout = 0) {
      if (dictationStatusTimer) clearTimeout(dictationStatusTimer);
      dictationStatusEl.textContent = message;
      dictationStatusEl.classList.toggle('visible', Boolean(message));
      if (message && timeout > 0) {
        dictationStatusTimer = setTimeout(() => {
          dictationStatusEl.textContent = '';
          dictationStatusEl.classList.remove('visible');
        }, timeout);
      }
    }

    function setListeningState(listening) {
      isListening = listening;
      micBtn.classList.toggle('listening', listening);
      micBtn.setAttribute('aria-pressed', String(listening));
      micBtn.setAttribute('aria-label', listening ? 'Stop dictation' : 'Start dictation');
      micBtn.title = listening ? 'Stop dictation' : 'Start dictation';
      syncComposerState();
    }

    function cancelDictation({ clearDraft = false } = {}) {
      const activeRecognition = recognition;
      recognition = null;
      dictationSilentEnd = true;
      if (activeRecognition) activeRecognition.abort();
      if (clearDraft) {
        inputEl.value = '';
        inputEl.style.height = 'auto';
      }
      setListeningState(false);
      showDictationStatus('');
    }

    function startDictation() {
      if (!SpeechRecognitionCtor || isTyping) return;
      if (isListening) {
        recognition?.stop();
        return;
      }
      if (!dictationDisclosureAcknowledged) {
        dictationDisclosureAcknowledged = true;
        persistDictationAck();
        micBtn.classList.add('awaiting-confirm');
        showDictationStatus(dictationMessage('dictationDisclosure'));
        return;
      }
      micBtn.classList.remove('awaiting-confirm');
      if (recognition) return;

      dictationBaseValue = inputEl.value.trimEnd();
      dictationFinalText = '';
      dictationHadError = false;
      dictationSilentEnd = false;
      const session = new SpeechRecognitionCtor();
      recognition = session;
      session.continuous = false;
      session.interimResults = true;
      session.maxAlternatives = 1;
      const dictationLocale = resolveDictationLocale();
      if (dictationLocale) session.lang = dictationLocale;

      session.onresult = (event) => {
        if (recognition !== session) return;
        let interimText = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0]?.transcript || '';
          if (event.results[i].isFinal) dictationFinalText += transcript;
          else interimText += transcript;
        }
        const spokenText = `${dictationFinalText}${interimText}`.trim();
        inputEl.value = `${dictationBaseValue}${dictationBaseValue && spokenText ? ' ' : ''}${spokenText}`;
        inputEl.dispatchEvent(new Event('input', { bubbles: true }));
      };

      session.onerror = (event) => {
        if (recognition !== session || (dictationSilentEnd && event.error === 'aborted')) return;
        dictationHadError = true;
        if (!dictationFinalText) inputEl.value = dictationBaseValue;
        const messageKinds = {
          'not-allowed': 'dictationDenied',
          'service-not-allowed': 'dictationUnavailable',
          'audio-capture': 'dictationNoMic',
          'no-speech': 'dictationNoSpeech',
          'network': 'dictationNetwork',
        };
        showDictationStatus(dictationMessage(messageKinds[event.error] || 'dictationUnexpected'), 4500);
      };

      session.onend = () => {
        if (recognition !== session) return;
        recognition = null;
        setListeningState(false);
        if (!dictationHadError && dictationFinalText.trim()) {
          showDictationStatus(dictationMessage('dictationReady'), 3000);
        } else if (!dictationHadError) {
          showDictationStatus(dictationMessage('dictationNoSpeech'), 3500);
        }
        inputEl.focus({ preventScroll: true });
      };

      setListeningState(true);
      showDictationStatus(dictationMessage('dictationListening'));
      try {
        session.start();
      } catch (error) {
        console.warn('[ClientRelay] Dictation could not start:', error);
        if (recognition === session) recognition = null;
        dictationHadError = true;
        setListeningState(false);
        showDictationStatus(dictationMessage('dictationStartFailed'), 4000);
      }
    }

    micBtn.addEventListener('click', startDictation);

    // Lead-capture shortcut: lets a visitor ask for the contact form instead of

    function formatMsg(text) {
      // Auto-link 📍/📌 addresses to Google Maps (before markdown parsing)
      var mapLines = text.split('\n');
      for (var mi = 0; mi < mapLines.length; mi++) {
        var ml = mapLines[mi];
        if (ml.indexOf('📍') < 0 && ml.indexOf('📌') < 0) continue;
        if (ml.indexOf('](') >= 0) continue;
        var mm = ml.match(/^([*\-\u2022]\s*)?(?:📍|📌)\uFE0F?\s*(.{3,120}?)\s*$/);
        if (!mm) continue;
        var addr = mm[2].replace(/[.;:]+$/, '').trim();
        if (addr.length < 3) continue;
        mapLines[mi] = (mm[1]||'') + '[📍 ' + addr + '](https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr) + ')';
      }
      text = mapLines.join('\n');
      const links = [];
      let cleaned = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, lt, url) => {
        const idx = links.length;
        // Validate and sanitize URL
        let safeUrl = '';
        try {
          // Handle spaces and backslashes in URL (e.g. from raw crawled product paths)
          let raw = url.trim().replace(/\s+/g, '%20').replace(/\\/g, '/');
          if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
          const parsed = new URL(raw);
          if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
            safeUrl = parsed.href;
          }
        } catch {
          safeUrl = '';
        }
        links.push({ text: lt.replace(/[\[\]]/g, '').replace(/:$/, ''), url: safeUrl });
        return `%%LINK${idx}%%`;
      });
      let safe = escapeHtml(cleaned);
      for (let i = 0; i < links.length; i++) {
        if (links[i].url) {
          const escapedUrl = links[i].url.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
          safe = safe.replace(`%%LINK${i}%%`,
            `<a href="${escapedUrl}" target="_blank" rel="noopener noreferrer nofollow">${escapeHtml(links[i].text)}</a>`);
        } else {
          safe = safe.replace(`%%LINK${i}%%`, escapeHtml(links[i].text));
        }
      }
      safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      safe = safe.replace(/^\* (.+)$/gm, '• $1');
      safe = safe.replace(/\n/g, '<br>');
      return safe;
    }

    function consumeBotMessageMarkers(text) {
      const source = String(text ?? '');
      const hasLeadFormMarker = source.includes('[LEAD_FORM]');
      return {
        cleanText: hasLeadFormMarker ? source.replace(/\[LEAD_FORM\]/g, '').trim() : source,
        hasLeadFormMarker,
      };
    }

    function renderLeadFormFromMarker(hasLeadFormMarker) {
      if (hasLeadFormMarker && leadConfig && leadConfig.enabled && !leadFormShown) {
        leadFormShown = true;
        renderLeadForm();
      }
    }

    function appendMsg(text, sender) {
      if (sender === 'bot') {
        const { cleanText, hasLeadFormMarker } = consumeBotMessageMarkers(text);
        if (cleanText) {
          const div = document.createElement('div');
          div.className = `ps-msg ${sender}`;
          div.innerHTML = `<div class="ps-bubble">${formatMsg(cleanText)}</div>`;
          messagesEl.appendChild(div);
        }
        renderLeadFormFromMarker(hasLeadFormMarker);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return;
      }
      const div = document.createElement('div');
      div.className = `ps-msg ${sender}`;
      const formatted = sender === 'bot' ? formatMsg(text) : escapeHtml(text);
      div.innerHTML = `<div class="ps-bubble">${formatted}</div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderLeadForm() {
      if (!leadConfig) return;
      leadFormRenderCount++;
      const fields = leadConfig.fields || {};
      const card = document.createElement('div');
      card.className = 'ps-msg bot';
      let fieldsHtml = '';
      if (fields.name && fields.name.enabled !== false) {
        fieldsHtml += `<label>${escapeHtml(fields.name.label || 'Navn')}${fields.name.required ? ' <span class="ps-req">*</span>' : ''}</label>
          <input type="text" id="ps-lead-name" placeholder="${escapeHtml(fields.name.placeholder || '')}">`;
      }
      if (fields.email && fields.email.enabled !== false) {
        fieldsHtml += `<label>${escapeHtml(fields.email.label || 'E-post')}${fields.email.required ? ' <span class="ps-req">*</span>' : ''}</label>
          <input type="email" id="ps-lead-email" placeholder="${escapeHtml(fields.email.placeholder || '')}">`;
      }
      if (fields.phone && fields.phone.enabled !== false) {
        fieldsHtml += `<label>${escapeHtml(fields.phone.label || 'Telefon')}${fields.phone.required ? ' <span class="ps-req">*</span>' : ''}</label>
          <input type="tel" id="ps-lead-phone" placeholder="${escapeHtml(fields.phone.placeholder || '')}">`;
      }
      if (fields.message && fields.message.enabled !== false) {
        fieldsHtml += `<label>${escapeHtml(fields.message.label || 'Melding')}${fields.message.required ? ' <span class="ps-req">*</span>' : ''}</label>
          <textarea id="ps-lead-message" rows="3" placeholder="${escapeHtml(fields.message.placeholder || '')}"></textarea>`;
      }
      card.innerHTML = `<div class="ps-lead-card">
        <button class="ps-lead-dismiss" aria-label="Lukk">×</button>
        ${fieldsHtml}
        <button class="ps-lead-submit">Send</button>
      </div>`;
      messagesEl.appendChild(card);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      // The form is on screen now, whether the bot offered it or the visitor
      // asked for it, so the shortcut has nothing left to do.
      leadBtn.hidden = true;

      card.querySelector('.ps-lead-dismiss').addEventListener('click', () => {
        card.remove();
        appendMsg(leadConfig.dismiss_message || 'Skjemaet ble lukket.', 'bot');
      });

      card.querySelector('.ps-lead-submit').addEventListener('click', async () => {
        const nameEl = document.getElementById('ps-lead-name');
        const emailEl = document.getElementById('ps-lead-email');
        const phoneEl = document.getElementById('ps-lead-phone');
        const messageEl = document.getElementById('ps-lead-message');
        const f = leadConfig.fields || {};
        if (f.name?.required && nameEl && !nameEl.value.trim()) { nameEl.focus(); return; }
        if (f.email?.required && emailEl && !emailEl.value.trim()) { emailEl.focus(); return; }
        if (f.phone?.required && phoneEl && !phoneEl.value.trim()) { phoneEl.focus(); return; }
        if (f.message?.required && messageEl && !messageEl.value.trim()) { messageEl.focus(); return; }

        const btn = card.querySelector('.ps-lead-submit');
        btn.disabled = true; btn.textContent = '...';

        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'apikey': _ANON, 'Authorization': 'Bearer ' + _ANON },
            body: JSON.stringify({
              clientId: CLIENT_ID, action: 'save-lead',
              name: nameEl?.value?.trim() || '',
              email: emailEl?.value?.trim() || '',
              phone: phoneEl?.value?.trim() || '',
              message: messageEl?.value?.trim() || '',
              pageUrl: window.location.href,
            }),
          });
        } catch { /* best effort */ }

        card.remove();
        appendMsg(leadConfig.success_message || 'Takk! Vi kontakter deg snart.', 'bot');
      });
    }

    function showTyping(text) {
      const div = document.createElement('div');
      div.className = 'ps-msg bot ps-typing';
      div.id = 'ps-typing-ind';
      div.setAttribute('role', 'status');
      div.setAttribute('aria-live', 'polite');
      div.innerHTML = '<div class="ps-bubble"><span></span><span></span><span></span><span class="ps-typing-label"></span></div>';
      const label = div.querySelector('.ps-typing-label');
      if (label) label.textContent = widgetMessage('thinking', text);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('ps-typing-ind');
      if (el) el.remove();
    }

    function invalidateActiveChatRequest(resetComposer) {
      activeChatGeneration++;
      activeChatController?.abort();
      activeChatController = null;
      if (resetComposer) {
        isTyping = false;
        removeTyping();
        syncComposerState();
      }
    }

    function generateProgressRequestId() {
      try {
        const uuid = crypto.randomUUID?.();
        if (/^[A-Za-z0-9_-]{16,64}$/.test(uuid || '')) return uuid;
      } catch { /* use byte fallback */ }
      try {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
      } catch {
        return `fallback_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 14)}`.slice(0, 64).padEnd(16, '0');
      }
    }

    let linkProgressRenderCount = 0;
    let assistantTerminalRenderCount = 0;
    let lastAssistantTerminalText = '';
    let lastAssistantRenderedText = '';

    function showLinkProgress(text) {
      const label = document.querySelector('#ps-typing-ind .ps-typing-label');
      if (label) {
        label.textContent = widgetMessage('retrievingLinks', text);
        linkProgressRenderCount++;
      }
    }

    function replaceTypingMessage(text, terminalReply = consumeBotMessageMarkers(text)) {
      assistantTerminalRenderCount++;
      lastAssistantTerminalText = String(text);
      const { cleanText, hasLeadFormMarker } = terminalReply;
      lastAssistantRenderedText = cleanText;
      const el = document.getElementById('ps-typing-ind');
      if (!el) { appendMsg(text, 'bot'); return; }
      if (!cleanText) {
        el.remove();
        renderLeadFormFromMarker(hasLeadFormMarker);
        return;
      }
      el.id = '';
      el.classList.remove('ps-typing');
      el.removeAttribute('role');
      el.removeAttribute('aria-live');
      const bubble = el.querySelector('.ps-bubble');
      if (bubble) bubble.innerHTML = formatMsg(cleanText);
      renderLeadFormFromMarker(hasLeadFormMarker);
    }

    async function readChatProtocolResponse(res, requestId, onProgress) {
      const contentType = String(res.headers.get('content-type') || '').toLowerCase();
      const mimeType = contentType.split(';', 1)[0].trim();
      if (mimeType !== 'text/event-stream') return await res.json();
      if (!res.body) throw new Error('Missing event stream');
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8', { fatal: true });
      let buffer = '';
      let byteCount = 0;
      let eventCount = 0;
      let expectedSeq = 1;
      let progressSeen = false;
      let terminal = null;

      const consume = (frame) => {
        const lines = frame.split('\n');
        let eventName = '';
        let dataLine = null;
        for (const line of lines) {
          if (!line) continue;
          if (line.startsWith('event: ')) {
            if (eventName) throw new Error('Duplicate event field');
            eventName = line.slice(7);
          } else if (line.startsWith('data: ')) {
            if (dataLine !== null) throw new Error('Duplicate data field');
            dataLine = line.slice(6);
          } else {
            throw new Error('Unsupported event stream field');
          }
        }
        if (!eventName || dataLine === null || !['progress', 'final', 'error'].includes(eventName)) throw new Error('Invalid event');
        if (++eventCount > 4) throw new Error('Too many events');
        const data = JSON.parse(dataLine);
        if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Invalid event data');
        if (data.protocolVersion !== 1 || data.requestId !== requestId || data.seq !== expectedSeq) throw new Error('Invalid event correlation');
        const exactKeys = (keys) => {
          const actual = Object.keys(data).sort();
          return actual.length === keys.length && keys.slice().sort().every((key, index) => key === actual[index]);
        };
        const frameBytes = new TextEncoder().encode(frame + '\n\n').byteLength;
        if (eventName === 'progress' && frameBytes > 2 * 1024) throw new Error('Progress event too large');
        if (eventName !== 'progress' && frameBytes > 128 * 1024) throw new Error('Terminal event too large');
        expectedSeq++;
        if (eventName === 'progress') {
          if (!exactKeys(['protocolVersion', 'requestId', 'seq', 'stage']) || progressSeen || data.stage !== 'retrieving_links' || terminal) throw new Error('Invalid progress event');
          progressSeen = true;
          onProgress();
          return;
        }
        if (!progressSeen || terminal) throw new Error('Invalid terminal event');
        if (eventName === 'final' && (!exactKeys(['protocolVersion', 'requestId', 'seq', 'ok', 'reply']) || data.ok !== true || typeof data.reply !== 'string')) throw new Error('Invalid final event');
        if (eventName === 'error' && (!exactKeys(['protocolVersion', 'requestId', 'seq', 'ok', 'error']) || data.ok !== false || typeof data.error !== 'string')) throw new Error('Invalid error event');
        terminal = data;
      };

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        byteCount += value.byteLength;
        if (byteCount > 256 * 1024) throw new Error('Event stream too large');
        buffer = (buffer + decoder.decode(value, { stream: true })).replace(/\r\n/g, '\n');
        let boundary;
        while ((boundary = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          if (frame) consume(frame);
        }
      }
      buffer = (buffer + decoder.decode()).replace(/\r\n/g, '\n');
      if (!terminal || buffer.trim()) throw new Error('Incomplete event stream');
      return terminal;
    }

    // ── Auto-resize textarea ─────────────────────────────────────
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    // ── Send message ─────────────────────────────────────────────
    async function sendMessage() {
      if (isListening) return;
      const text = inputEl.value.trim();
      if (!text) return;

      const now = Date.now();
      const recent = timestamps.filter(t => now - t < 60000);
      if (recent.length >= MAX_PER_MIN) {
        appendMsg(widgetMessage('rateLimit', text), 'bot');
        return;
      }
      timestamps.push(now);

      invalidateActiveChatRequest(false);
      const generation = activeChatGeneration;
      appendMsg(text, 'user');
      inputEl.value = '';
      showDictationStatus('');
      inputEl.style.height = 'auto';
      suggestionsEl.innerHTML = '';
      isTyping = true;
      syncComposerState();
      removeTyping();
      showTyping(text);

      const controller = new AbortController();
      activeChatController = controller;
      const timeout = setTimeout(() => controller.abort(), 65000);
      const requestId = generateProgressRequestId();
      const isCurrentRequest = () => activeChatGeneration === generation && activeChatController === controller;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream, application/json', 'apikey': _ANON, 'Authorization': 'Bearer ' + _ANON },
          body: JSON.stringify({ message: text, history: chatHistory, clientId: CLIENT_ID, progressProtocolVersion: 1, requestId }),
          signal: controller.signal,
        });
        const data = await readChatProtocolResponse(res, requestId, () => {
          if (isCurrentRequest()) showLinkProgress(text);
        });
        if (!isCurrentRequest()) return;

        if (res.ok && data.reply) {
          const terminalReply = consumeBotMessageMarkers(data.reply);
          chatHistory.push({ role: 'user',  parts: [{ text }] });
          chatHistory.push({ role: 'model', parts: [{ text: terminalReply.cleanText }] });
          replaceTypingMessage(data.reply, terminalReply);
        } else {
          replaceTypingMessage(String(data.error || widgetMessage('genericError', text)).slice(0, 500));
        }
      } catch {
        controller.abort();
        if (isCurrentRequest()) replaceTypingMessage(widgetMessage('connectionError', text));
      } finally {
        clearTimeout(timeout);
        if (isCurrentRequest()) {
          activeChatController = null;
          isTyping = false;
          syncComposerState();
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }
    }

    sendBtn.addEventListener('click', () => {
      if (inHumanMode && liveSessionId) {
        const text = inputEl.value.trim();
        if (text) sendHumanMessage(text);
      } else {
        sendMessage();
      }
    });
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (inHumanMode && liveSessionId) {
          const text = inputEl.value.trim();
          if (text) sendHumanMessage(text);
        } else {
          sendMessage();
        }
      }
    });

    // ── Human Assist Logic ─────────────────────────────────────────
    function generateSessionToken() {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return 'v_' + Date.now() + '_' + Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }

    async function requestHuman() {
      if (inHumanMode || !humanAvailable) return;
      appendMsg('Connecting you with a team member...', 'bot');
      if (humanBtn) humanBtn.classList.remove('visible');

      try {
        const sessionToken = generateSessionToken();
        const aiHistory = chatHistory.slice(-10).map(h => ({
          role: h.role === 'user' ? 'user' : 'assistant',
          content: h.parts?.[0]?.text || '',
        }));
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': _ANON, 'Authorization': 'Bearer ' + _ANON },
          body: JSON.stringify({
            clientId: CLIENT_ID,
            action: 'human-request',
            sessionToken,
            pageUrl: window.location.href,
            aiHistory,
          }),
        });
        const data = await res.json();
        if (!data.ok || !data.sessionId) {
          appendMsg('I\'m sorry, but the human operator is not currently available - would you be ok to talk to me instead?', 'bot');
          return;
        }
        liveSessionId = data.sessionId;
        liveSessionToken = sessionToken;
        inHumanMode = true;
        humanPollLastTime = new Date().toISOString();

        let waitTime = 0;
        humanPollInterval = setInterval(async () => {
          waitTime += 2000;
          if (waitTime >= 30000 && liveSessionId) {
            clearInterval(humanPollInterval);
            humanPollInterval = null;
            try {
              fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': _ANON, 'Authorization': 'Bearer ' + _ANON },
                body: JSON.stringify({
                  clientId: CLIENT_ID,
                  action: 'human-cancel',
                  sessionId: liveSessionId,
                  sessionToken: liveSessionToken,
                }),
              });
            } catch { /* best-effort */ }
            inHumanMode = false;
            liveSessionId = null;
            liveSessionToken = null;
            appendMsg('I\'m sorry, but the human operator is not currently available - would you be ok to talk to me instead?', 'bot');
            return;
          }
          try {
            const pollRes = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'apikey': _ANON, 'Authorization': 'Bearer ' + _ANON },
              body: JSON.stringify({
                clientId: CLIENT_ID,
                action: 'human-poll',
                sessionId: liveSessionId,
                sessionToken: liveSessionToken,
                lastTime: humanPollLastTime,
              }),
            });
            const pollData = await pollRes.json();
            if (pollData.status === 'active') {
              waitTime = -999999;
              if (pollData.messages && pollData.messages.length > 0) {
                for (const m of pollData.messages) {
                  appendMsg(m.content, 'bot');
                  humanPollLastTime = m.time;
                }
              }
            } else if (pollData.status === 'closed') {
              clearInterval(humanPollInterval);
              humanPollInterval = null;
              inHumanMode = false;
              liveSessionId = null;
              appendMsg('The team member has ended the conversation. The AI assistant will continue from here.', 'bot');
            }
          } catch { /* silent */ }
        }, 2000);
      } catch (e) {
        console.error('[ClientRelay] Human request error:', e);
        appendMsg('I\'m sorry, but the human operator is not currently available - would you be ok to talk to me instead?', 'bot');
      }
    }

    async function sendHumanMessage(text) {
      if (isListening) return;
      appendMsg(text, 'user');
      inputEl.value = '';
      showDictationStatus('');
      inputEl.style.height = 'auto';
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': _ANON, 'Authorization': 'Bearer ' + _ANON },
          body: JSON.stringify({
            clientId: CLIENT_ID,
            action: 'human-send',
            sessionId: liveSessionId,
            sessionToken: liveSessionToken,
            content: text,
          }),
        });
      } catch { /* silent */ }
    }

    if (humanBtn) {
      humanBtn.addEventListener('click', requestHuman);
    }

    // ── Suggestion clicks ────────────────────────────────────────
    suggestionsEl.addEventListener('click', e => {
      if (e.target.classList.contains('ps-suggest-btn')) {
        inputEl.value = e.target.textContent;
        sendMessage();
      }
    });

    // ── Link clicks ──────────────────────────────────────────────
    messagesEl.addEventListener('click', e => {
      const link = e.target.closest('a');
      if (link && link.href) { e.preventDefault(); window.open(link.href, '_blank', 'noopener'); }
    });

    // ── New chat button ─────────────────────────────────────────
    async function resetChat() {
      invalidateActiveChatRequest(true);
      const resetGeneration = activeChatGeneration;
      cancelDictation({ clearDraft: true });
      messagesEl.innerHTML = '';
      suggestionsEl.innerHTML = '';
      chatHistory = [];
      leadFormShown = false;
      if (leadConfig && leadConfig.enabled) leadBtn.hidden = false;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      appendPrivacyNotice();
      // Reload greeting + suggestions
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': _ANON, 'Authorization': 'Bearer ' + _ANON },
          body: JSON.stringify({ clientId: CLIENT_ID, action: 'config' }),
        });
        if (activeChatGeneration !== resetGeneration) return;
        if (res.ok) {
          const data = await res.json();
          if (activeChatGeneration !== resetGeneration) return;
          if (data.greeting) appendMsg(data.greeting, 'bot');
          if (data.suggestions && data.suggestions.length > 0) {
            suggestionsEl.innerHTML = data.suggestions
              .map(s => `<button class="ps-suggest-btn">${escapeHtml(s)}</button>`)
              .join('');
          }
        }
      } catch { /* silent */ }
      if (activeChatGeneration === resetGeneration) inputEl.focus({ preventScroll: true });
    }
    document.getElementById('chatNewBtn').addEventListener('click', resetChat);

    if (window.__CLIENTRELAY_TEST__ === true) {
      window.__clientRelayProgressTestHooks = Object.freeze({
        sendMessage,
        resetChat,
        readChatProtocolResponse,
        invalidateActiveChatRequest,
        generateProgressRequestId,
        requestHuman,
        getState: () => ({
          generation: activeChatGeneration,
          isTyping,
          active: Boolean(activeChatController),
          historyLength: chatHistory.length,
          inputDisabled: inputEl.disabled,
          inputReadOnly: inputEl.readOnly,
          sendDisabled: sendBtn.disabled,
          messagesText: messagesEl.textContent,
          linkProgressRenderCount,
          assistantTerminalRenderCount,
          lastAssistantTerminalText,
          lastAssistantRenderedText,
          leadFormShown,
          leadFormRenderCount,
          leadConfigEnabled: Boolean(leadConfig && leadConfig.enabled),
          history: chatHistory.map(item => ({
            role: item.role,
            parts: item.parts?.map(part => ({ text: part.text })) || [],
          })),
        }),
        setInput: (value) => { inputEl.value = String(value); },
      });
    }

    // ── Load config (greeting + suggestions + widget config) ─────
    (async () => {
      appendPrivacyNotice();
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': _ANON, 'Authorization': 'Bearer ' + _ANON },
          body: JSON.stringify({ clientId: CLIENT_ID, action: 'config' }),
        });
        if (res.ok) {
          const data = await res.json();

          // Apply widget config
          const wc = data.widget_config || {};
          if (micBtn && wc.dictation_enabled === true && SpeechRecognitionCtor) micBtn.hidden = false;
          if (typeof wc.dictation_lang === 'string') dictationLocaleOverride = wc.dictation_lang.trim();
          // Keep the bot's own words around: they tell us which language its
          // visitors speak, which the browser's UI language does not.
          botLanguageSample = [
            data.greeting || wc.greeting || '',
            Array.isArray(data.suggestions) ? data.suggestions.join(' ') : '',
          ].join(' ').trim();
          refreshPrivacyNotices();
          if (wc.name)   document.getElementById('chatName').textContent = wc.name;
          if (typeof wc.placeholder === 'string') {
            inputEl.placeholder = wc.placeholder.trim() || 'Type a message...';
          }
          if (wc.avatar) {
            const el = document.getElementById('chatAvatar');
            if (wc.avatar.startsWith('http://') || wc.avatar.startsWith('https://')) {
              el.innerHTML = `<img src="${wc.avatar}" alt="" />`;
            } else {
              el.textContent = wc.avatar;
            }
          }
          if (wc.color) applyBrandColor(wc.color);
          if (Object.prototype.hasOwnProperty.call(wc, 'brand_text_color')) {
            applyBrandTextColor(wc.brand_text_color);
          }
          if (wc.bg) {
            document.documentElement.style.setProperty('--bg', wc.bg);
          }
          if (wc.text_color) {
            document.documentElement.style.setProperty('--text', wc.text_color);
          }
          if (document.title === 'AI Chat' && wc.name) {
            document.title = wc.name;
          }

          // Greeting
          if (data.greeting) appendMsg(data.greeting, 'bot');

          // Lead capture config
          if (wc.lead_capture && wc.lead_capture.enabled) {
            leadConfig = wc.lead_capture;
            leadBtn.hidden = false;
          }

          // Human Assist: show button only if operator is live
          if (data.humanAvailable) {
            humanAvailable = true;
            if (humanBtn) humanBtn.classList.add('visible');
          }

          // TEMPORARILY DISABLED: branding always visible for marketing.
          // if (wc.hide_branding === true) {
          //   const footer = document.getElementById('chatFooter');
          //   if (footer) footer.style.display = 'none';
          // }

          // This site uses the fixed Simply BRF footer requested for Rabatten.

          // Suggestions
          if (data.suggestions && data.suggestions.length > 0) {
            suggestionsEl.innerHTML = data.suggestions
              .map(s => `<button class="ps-suggest-btn">${escapeHtml(s)}</button>`)
              .join('');
          }
        }
      } catch { /* silent */ }

      document.querySelector('.chat-wrap').classList.add('ready');
      inputEl.focus({ preventScroll: true });
    })();
  })();
</script>
</body>
</html>
